name: Publish prices history

on:
  push:
    branches: [main]
    paths:
      - ghtb-prices-history-upload.zip
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout site package
        uses: actions/checkout@v6
      - name: Extract static site
        run: unzip -q ghtb-prices-history-upload.zip -d _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Wait for artifact indexing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            count=$(gh api "/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts?name=github-pages" --jq '.total_count' 2>/dev/null || echo 0)
            echo "Attempt $i: total_count=$count"
            if [ "$count" -gt 0 ]; then
              break
            fi
            sleep 3
          done
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

